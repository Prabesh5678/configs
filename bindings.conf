# --- Converted from i3 config ---

# Media keys (check your Omarchy default bindings.conf first — these are
# very likely already bound there via wpctl; binding them again here will
# double every volume step)
bindd = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+
bindd = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindd = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindd = , XF86AudioMicMute, Mic mute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Terminal / launcher
bindd = ALT, T, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = ALT, SPACE, App launcher, exec, omarchy-launch-walker

# Window management
bindd = SUPER, Q, Kill active window, killactive,
bindd = ALT, F, Fullscreen, fullscreen, 0

# Focus movement
bindd = ALT, H, Focus left, movefocus, l
bindd = ALT, J, Focus down, movefocus, d
bindd = ALT, K, Focus up, movefocus, u
bindd = ALT, L, Focus right, movefocus, r

# Move window
bindd = ALT SHIFT, H, Move window left, movewindow, l
bindd = ALT SHIFT, J, Move window down, movewindow, d
bindd = ALT SHIFT, K, Move window up, movewindow, u
bindd = ALT SHIFT, L, Move window right, movewindow, r

# Workspaces
bindd = ALT, 1, Workspace 1, workspace, 1
bindd = ALT, 2, Workspace 2, workspace, 2
bindd = ALT, 3, Workspace 3, workspace, 3
bindd = ALT, 4, Workspace 4, workspace, 4
bindd = ALT, 5, Workspace 5, workspace, 5
bindd = ALT, 6, Workspace 6, workspace, 6
bindd = ALT, 7, Workspace 7, workspace, 7
bindd = ALT, 8, Workspace 8, workspace, 8
bindd = ALT, 9, Workspace 9, workspace, 9
bindd = ALT, 0, Workspace 10, workspace, 10

bindd = ALT SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = ALT SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = ALT SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = ALT SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = ALT SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = ALT SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = ALT SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = ALT SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = ALT SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = ALT SHIFT, 0, Move to workspace 10, movetoworkspace, 10

# Screenshots
bindd = , Print, Screenshot region, exec, flameshot gui -p ~/ssd/screenshots
bindd = SUPER, Print, Screenshot full, exec, flameshot full -p ~/ssd/screenshots
bindd = , F11, Toggle fullscreen, fullscreen, 0 

bind = , F13, exec, brightnessctl -d amdgpu_bl2 set 5%-
bind = , F14, exec, brightnessctl -d amdgpu_bl2 set 5%+

bind = SUPER SHIFT, N, exec, ~/.config/hypr/scripts/nightlight.sh

bind = ALT, TAB, layoutmsg, cyclenext
bind = ALT SHIFT, TAB, layoutmsg, cycleprev
